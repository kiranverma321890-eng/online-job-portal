{% extends 'adminbase.html' %}
{% load static %}
{% block admin %}

<style>
/* Dashboard */
body {
    background: #F5F7FA !important;
    color: #2D3748;
}

.container-fluid {
    background: #F5F7FA;
}

.container-fluid > h2 {
    color: #1E3A5F !important;
    font-size: 2.1rem;
    font-weight: 700;
    letter-spacing: .2px;
}

/* Dashboard Cards */
.glass-card {
    background: #FFFFFF;
    border: 1px solid #E2E8F0;
    border-radius: 16px;
    box-shadow: 0 4px 12px rgba(0, 0, 0, .08);
    transition: all .25s ease;
}

.glass-card:hover {
    border-color: #4F9DDE !important;
    box-shadow: 0 12px 30px rgb(9, 36, 71);
    transform: translateY(-3px);
}

.feature-card {
    min-height: 190px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
}

.feature-card i {
    margin-bottom: 15px;
}

.feature-card h6 {
    color: #718096 !important;
    font-weight: 500;
}

.feature-card h2 {
    color: #1E3A5F !important;
    font-size: 2rem;
    font-weight: 700;
}

/* Icons */
.feature-card .text-info {
    color: #4F9DDE !important;
}

.feature-card .text-success {
    color: #2563EB !important;
}

.feature-card .text-warning {
    color: #4F9DDE !important;
}

.feature-card .text-danger {
    color: #1E3A5F !important;
}

/* Performance Section */
.glass-card h4 {
    color: #1E3A5F !important;
    font-weight: 600;
}

.glass-card .btn {
    background: #1E3A5F !important;
    color: #FFFFFF !important;
    border: 1px solid #1E3A5F;
    border-radius: 8px;
}

.glass-card .btn:hover {
    background: #2563EB !important;
    border-color: #2563EB;
}

/* Chart */
.chart-area {
    height: 350px;
    border-radius: 12px;
    border: 1px dashed #D6DEE8;
    background: #F8FAFC;
}

/* Responsive */
@media (max-width: 767px) {
    .container-fluid > h2 {
        font-size: 1.7rem;
    }

    .feature-card {
        min-height: 160px;
    }

    .chart-area {
        height: 280px;
    }
}
</style>

<div class="container-fluid mt-3">

    <h2 class="fw-bold">ADMIN DASHBOARD</h2>

    <div class="row g-4" style="margin-top:10px;">

        <!-- Total Jobs -->
        <div class="col-md-3">
            <div class="glass-card feature-card text-center p-4 h-100 hover-lift">
                <i class="bi bi-briefcase-fill fs-1 text-info"></i>
                <h6 class="mt-3">Total Jobs</h6>
                <h2>{{total_jobs}}</h2>
            </div>
        </div>

        <!-- Job Seekers -->
        <div class="col-md-3">
            <div class="glass-card feature-card text-center p-4 h-100 hover-lift">
                <i class="bi bi-people-fill fs-1 text-success"></i>
                <h6 class="mt-3">Job Seekers</h6>
                <h2>{{total_seekers}}</h2>
            </div>
        </div>

        <!-- Posted Jobs -->
        <div class="col-md-3">
            <div class="glass-card feature-card text-center p-4 h-100 hover-lift">
                <i class="bi bi-file-earmark-text-fill fs-1 text-warning"></i>
                <h6 class="mt-3">Posted Jobs</h6>
                <h2>10</h2>
            </div>
        </div>

        <!-- Enquiries -->
        <div class="col-md-3">
            <div class="glass-card feature-card text-center p-4 h-100 hover-lift">
                <i class="bi bi-chat-dots-fill fs-1 text-danger"></i>
                <h6 class="mt-3">Enquiries</h6>
                <h2>{{total_enquiry}}</h2>
            </div>
        </div>

    </div>

    <!-- Graph Section -->
    <div class="row mt-4">
        <div class="col-12">
            <div class="glass-card p-4">

                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h4 class="mb-0">Platform Performance</h4>

                    <button class="btn px-4 fw-semibold">
                        View Full Report
                    </button>
                </div>

                <!-- Chart Area -->
                <div class="chart-area">
                    <!-- Chart goes here -->
                </div>

            </div>
        </div>
    </div>

</div>

{% endblock %}
