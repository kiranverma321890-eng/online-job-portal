{% extends 'adminbase.html' %}
{% load static %}
{% block admin %}

<style>
    body {
        background: #F5F7FA;
        color: #2D3748;
    }

    .page-title {
        background: #FFFFFF;
        color: #1E3A5F;
        text-align: center;
        border: 1px solid #E2E8F0;
        border-radius: 50px 0 50px 0;
        padding: 12px;
        margin-bottom: 25px;
        font-size: 1.8rem;
        font-weight: 700;
        box-shadow: 0 4px 12px rgba(0, 0, 0, .08);
    }

    .table-glass {
        background: #FFFFFF;
        border: 1px solid #E2E8F0;
        border-radius: 20px;
        padding: 25px;
        box-shadow: 0 4px 12px rgba(0, 0, 0, .08);
        overflow-x: auto;
        transition: .3s;
    }

    .table-glass:hover {
        border-color: #4F9DDE;
        box-shadow: 0 12px 30px rgb(9, 36, 71);
    }

    .complaint-table {
        color: #2D3748;
        margin: 0;
        border-collapse: separate;
        border-spacing: 0;
    }

    .table th,
    .table td {
        white-space: nowrap;
    }

    .complaint-table th {
        background: #F1F5F9;
        color: #1E3A5F;
        font-size: 15px;
        font-weight: 600;
        padding: 15px;
        border-bottom: 1px solid #D6DEE8;
        white-space: nowrap;
    }

    .complaint-table td {
        color: #2D3748;
        padding: 15px;
        border-bottom: 1px solid #E2E8F0;
        vertical-align: middle;
    }

    .complaint-table tbody tr {
        transition: .25s;
    }

    .complaint-table tbody tr:hover {
        background: #F8FAFC;
    }

    .complaint-table tbody tr:last-child td {
        border-bottom: none;
    }

    .no-data {
        text-align: center;
        color: #718096;
        padding: 30px;
    }

    @media (max-width: 768px) {
        .page-title {
            font-size: 1.4rem;
        }

        .table-glass {
            padding: 15px;
        }

        .complaint-table th,
        .complaint-table td {
            padding: 10px;
        }
    }
</style>

<h1 class="page-title">VIEW COMPLAINT</h1>

<div class="table-glass">
    <table class="table complaint-table">
        <thead>
            <tr>
                <th>Id</th>
                <th>Name</th>
                <th>Contact No</th>
                <th>Subject</th>
                <th>Complaint</th>
                <th>Posted Date</th>
                <th>Delete</th>
            </tr>
        </thead>
        <tbody>
            {% for r in res %}
            <tr>
                <td>{{r.id}}</td>
                <td>{{r.name}}</td>
                <td>{{r.contactno}}</td>
                <td>{{r.subject}}</td>
                <td>{{r.responsetext}}</td>
                <td>{{r.posteddate}}</td>
                <td>
                    <a href="{% url 'deleteresponse' id=r.id %}" class="btn btn-danger btn-sm">
                        Delete
                    </a>
                </td>

            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>

{% endblock %}
