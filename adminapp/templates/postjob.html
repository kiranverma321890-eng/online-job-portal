{% extends 'adminbase.html' %}
{% load static %}
{% block admin %}

<style>
body {
    background: #F5F7FA;
    color: #2D3748;
}

.page-title {
    background: #FFFFFF;
    text-align: center;
    color: #1E3A5F;
    border: 1px solid #E2E8F0;
    border-radius: 50px 0 50px 0;
    padding: 15px;
    margin-bottom: 30px;
    font-weight: 700;
    box-shadow: 0 4px 12px rgba(0,0,0,.08);
}

.glass-card {
    background: #FFFFFF;
    border: 1px solid #E2E8F0;
    border-radius: 20px;
    box-shadow: 0 4px 12px rgba(0,0,0,.08);
    padding: 35px;
    transition: .3s ease;
}

.glass-card:hover {
    border-color: #4F9DDE;
    box-shadow: 0 12px 30px rgb(9, 36, 71);
    transform: translateY(-3px);
}

.form-label {
    color: #2D3748;
    font-weight: 600;
    margin-bottom: 8px;
}

.form-control,
.form-select {
    background: #FFFFFF;
    border: 1px solid #D6DEE8;
    color: #2D3748;
    border-radius: 10px;
    padding: 12px 15px;
}

.form-control:focus,
.form-select:focus {
    background: #FFFFFF;
    color: #2D3748;
    border-color: #4F9DDE;
    box-shadow: 0 0 0 .2rem rgba(79,157,222,.15);
}

.form-control::placeholder {
    color: #718096;
}

.form-select option {
    background: #FFFFFF;
    color: #2D3748;
}

.submit-btn {
    background: #1E3A5F;
    border: none;
    color: #FFFFFF;
    padding: 12px 35px;
    border-radius: 10px;
    font-weight: 600;
    transition: .25s;
}

.submit-btn:hover {
    background: #2563EB;
    color: #FFFFFF;
    transform: translateY(-2px);
    box-shadow: 0 6px 18px rgba(37,99,235,.22);
}

.alert {
    border-radius: 10px;
}

@media (max-width: 768px) {
    .page-title {
        font-size: 1.4rem;
    }

    .glass-card {
        padding: 25px 20px;
    }
}
</style>

<h2 class="page-title">
    <i class="bi bi-briefcase-fill me-2"></i>
    POST A NEW JOB
</h2>
{% if messages %}
    {% for m in messages %}
        <div class="alert alert-warning alert-dismissible fade show"
            style="width:90%;margin:15px auto;padding:12px 18px;background:#FFF4D6;color:#664D03;border:1px solid #FFDA6A;border-radius:10px;font-weight:500;box-shadow:0 5px 15px rgba(0,0,0,.08);">
            <i class="bi bi-exclamation-circle-fill me-2"></i>
            {{m}}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
    {% endfor %}
{% endif %}

<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="glass-card">
            <form method="post">
                {% csrf_token %}
            <div class="row g-4">
                <div class="col-md-6">
                    <label class="form-label">Job Title</label>
                    <input type="text" name="title" class="form-control" placeholder="Enter Job Title" required>
                </div>

                <div class="col-md-6">
                    <label class="form-label">Location</label>
                    <input type="text" name="location" class="form-control" placeholder="Enter Location" required>
                </div>

                <div class="col-12">
                    <label class="form-label">Job Description</label>
                    <textarea name="description" rows="5" class="form-control" placeholder="Enter Job Description" required></textarea>
                </div>

                <div class="col-md-6">
                    <label class="form-label">Salary</label>
                    <input type="text" name="salary" class="form-control" placeholder="Enter Salary" required>
                </div>

                <div class="col-md-6">
                    <label class="form-label">Job Type</label>
                    <select class="form-select" name="jobtype">
                        <option>Full Time</option>
                        <option>Part Time</option>
                        <option>Internship</option>
                    </select>
                </div>

                <div class="col-md-6">
                    <label class="form-label">Last Date</label>
                    <input type="date" name="lastdate" class="form-control" required>
                </div>

                <div class="col-md-6">
                    <label class="form-label">Posted Date</label>
                    <input type="date" name="posteddate" class="form-control" required>
                </div>

                <div class="col-12 text-center mt-4">
                    <button type="submit" class="submit-btn">
                        <i class="bi bi-plus-circle me-2"></i>
                        Post Job
                    </button>
                </div>
            </div>
        </form>
    </div>
</div>
```

</div>

{% endblock %}
