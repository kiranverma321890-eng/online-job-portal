{% extends 'base.html' %}

{% block main %}

<section class="bg-light min-vh-100 d-flex align-items-center py-5">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-sm-10 col-md-8 col-lg-5 col-xl-4">

        <div class="card border-0 shadow-sm rounded-4">
          <div class="card-body p-4 p-sm-5">

            <!-- Header -->
            <div class="text-center mb-4">
              <h3 class="fw-bold text-dark mb-1">Welcome Back</h3>
              <p class="text-secondary small mb-0">Please sign in to your account</p>
            </div>
            {% if messages %}
            {% for m in messages %}
            <div class="alert alert-warning alert-dismissible fade show" role="alert">
              {{ m }}
              <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
            {% endfor %}
            {% endif %}
            <!-- Form -->
            <form method="post">
              {% csrf_token %}

              <div class="mb-3">
                <label for="id_username" class="form-label small fw-medium text-secondary">Username</label>
                <input type="text" name="username" id="id_username"
                  class="form-control form-control-lg bg-light border-0 fs-6" placeholder="johndoe" required>
              </div>


              <div class="mb-3">
                <div class="d-flex justify-content-between align-items-center mb-1">
                  <label for="id_password" class="form-label small fw-medium text-secondary mb-0">Password</label>
                </div>
                <input type="password" name="password" id="id_password"
                  class="form-control form-control-lg bg-light border-0 fs-6" placeholder="••••••••" required>
              </div>

              <div class="form-check mb-4">
                <input class="form-check-input" type="checkbox" id="rememberMe">
                <label class="form-check-label small text-secondary" for="rememberMe">
                  Remember me
                </label>
              </div>

              <button type="submit" class="btn btn-primary btn-lg w-100 fw-semibold shadow-sm fs-6">
                Sign In
              </button>
            </form>

            <!-- Footer Link -->
            <div class="text-center mt-4 pt-2 border-top">
              <p class="text-secondary small mb-0">
                Don't have an account?
                <a href="{% url 'register' %}" class="text-primary fw-semibold text-decoration-none">
                  Create account
                </a>
              </p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>

{% endblock %}
