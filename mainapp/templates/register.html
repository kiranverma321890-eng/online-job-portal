{% extends 'base.html' %}

{% block main %}

<section class="bg-light min-vh-100 d-flex align-items-center py-5">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-sm-10 col-md-8 col-lg-6 col-xl-5">
        
        <div class="card border-0 shadow-sm rounded-4">
          <div class="card-body p-4 p-sm-5">
            
            <!-- Header -->
            <div class="text-center mb-4">
              <h3 class="fw-bold text-dark mb-1">Create Account</h3>
              <p class="text-secondary small mb-0">Join us to start finding or posting jobs</p>
            </div>

            <!-- Form -->
            <form method="post" action="">
              {% csrf_token %}

              <div class="mb-3">
                <label for="id_name" class="form-label small fw-medium text-secondary">Full Name</label>
                <input 
                  type="text" 
                  name="name" 
                  id="id_name" 
                  class="form-control form-control-lg bg-light border-0 fs-6" 
                  placeholder="John Doe" 
                  required
                >
              </div>

              <div class="mb-3">
                <label for="id_email" class="form-label small fw-medium text-secondary">Email Address</label>
                <input 
                  type="email" 
                  name="email" 
                  id="id_email" 
                  class="form-control form-control-lg bg-light border-0 fs-6" 
                  placeholder="name@example.com" 
                  required
                >
              </div>

              <div class="mb-3">
                <label for="id_password" class="form-label small fw-medium text-secondary">Password</label>
                <input 
                  type="password" 
                  name="password" 
                  id="id_password" 
                  class="form-control form-control-lg bg-light border-0 fs-6" 
                  placeholder="••••••••" 
                  required
                >
              </div>

              <div class="form-check mb-4">
                <input class="form-check-input" type="checkbox" id="terms" required>
                <label class="form-check-label small text-secondary" for="terms">
                  I agree to the <a href="#" class="text-primary text-decoration-none">Terms & Conditions</a>
                </label>
              </div>

              <button type="submit" class="btn btn-primary btn-lg w-100 fw-semibold shadow-sm fs-6">
                Register
              </button>
            </form>

            <!-- Footer Link -->
            <div class="text-center mt-4 pt-2 border-top">
              <p class="text-secondary small mb-0">
                Already have an account? 
                <a href="{% url 'login' %}" class="text-primary fw-semibold text-decoration-none">
                  Sign in
                </a>
              </p>
            </div>

          </div>
        </div>

      </div>
    </div>
  </div>
</section>

{% endblock %}
